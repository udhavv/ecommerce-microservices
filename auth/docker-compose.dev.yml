services:
  # ============================================================================
  # PostgreSQL Database Service (Development)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres-dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth_dev_network

  # ============================================================================
  # Auth Microservice (Development with Hot Reloading)
  # ============================================================================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: auth-service-dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORT}:4000"
    volumes:
      - ./src:/app/src
      - ./database:/app/database
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV
      - PORT
      - DATABASE_URL
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - DB_SSL
      - DB_POOL_MAX
      - JWT_ACCESS_SECRET
      - JWT_REFRESH_SECRET
      - JWT_ACCESS_EXPIRY
      - JWT_REFRESH_EXPIRY
      - VERSION
      - PRODUCTION_FRONTEND_URL
      - FRONTEND_URL_DEVELOPMENT
      - HOST
      - MAIL_PORT
      - SMTP_USER
      - SMTP_PASS
      - MAIL_FROM
      - BACKEND_URL
      - GRAFANA_CLOUD_LOKI_URL
      - GRAFANA_CLOUD_LOKI_USER
      - GRAFANA_CLOUD_API_TOKEN
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth_dev_network

volumes:
  postgres_dev_data:
    name: auth_postgres_dev_data

networks:
  auth_dev_network:
    name: auth_dev_network
    driver: bridge
