apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      derivedFields:
        # Allows clicking a trace/request ID in logs
        - matcherRegex: '"req":{"id":"(.*?)"}'
          name: TraceID
          url: '$${__value.raw}'
