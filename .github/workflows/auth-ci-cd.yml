name: Auth Microservice CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'auth/**'
      - '.github/workflows/auth-ci-cd.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'auth/**'
      - '.github/workflows/auth-ci-cd.yml'

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. Test & Quality Checks
  # ============================================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'auth/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/auth_test_db
          JWT_ACCESS_SECRET: ci_test_access_secret_32_characters_long
          JWT_REFRESH_SECRET: ci_test_refresh_secret_32_characters_long
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
        run: npm test

  # ============================================================================
  # 2. Build & Verify Docker Image
  # ============================================================================
  build-docker:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./auth
          file: ./auth/Dockerfile
          push: false
          tags: auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Observability & Docker Compose Verification
  # ============================================================================
  verify-stack:
    name: Verify Docker Compose & Observability Stack
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

  # ============================================================================
  # 4. Push Image to GHCR & Deploy to Render (main branch only)
  # ============================================================================
  publish-and-deploy:
    name: Push to GHCR & Deploy to Render
    needs: [build-docker, verify-stack]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo_name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}/auth-service
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./auth
          file: ./auth/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deployment
        env:
          RENDER_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Clean whitespace, linebreaks, and accidental surrounding quotes
          CLEAN_HOOK=$(echo "$RENDER_HOOK_URL" | tr -d '\r\n"' | xargs)

          if [ -z "$CLEAN_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set!"
            echo "Please set RENDER_DEPLOY_HOOK_URL in GitHub Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          if [[ ! "$CLEAN_HOOK" =~ ^https?:// ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not a valid HTTP URL!"
            exit 1
          fi

          # Display masked URL to confirm correct format without leaking secret key
          MASKED_HOOK=$(echo "$CLEAN_HOOK" | sed -E 's/(key=)[^&]+/\1***/g')
          echo "Triggering Render deployment at: $MASKED_HOOK"

          RESPONSE=$(curl -s -S -w "\n%{http_code}" -X POST "$CLEAN_HOOK")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Render response status: $HTTP_STATUS"
          echo "Render response body: $BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment triggered successfully!"
          else
            echo "::error::Failed to trigger Render deployment (HTTP $HTTP_STATUS)."
            echo "Please verify in Render Dashboard -> Settings -> Deploy Hook that the URL is exact: https://api.render.com/deploy/srv-xxxx?key=yyyy"
            exit 1
          fi
